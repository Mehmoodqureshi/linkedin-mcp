name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [18, 20, 22]
        # One Windows job guards against POSIX-only assumptions (`ps`, .cmd bin
        # shims) regressing for native-Windows users.
        include:
          - os: windows-latest
            node-version: 22
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    env:
      # The driver's Chromium isn't needed for typecheck/build/unit tests.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Typecheck (main)
        run: npm run typecheck

      - name: Typecheck (renderer)
        run: npm run typecheck:react

      - name: Typecheck (tests)
        run: npm run typecheck:test

      - name: Build
        run: npm run build

      - name: Test (unit)
        # Unit tests only; the connect/tool smoke tests need Electron + a display.
        run: npm run test:unit
