# Builds the desktop installers (macOS .dmg, Windows .exe) on their NATIVE
# runners plus the one-click .mcpb bundle, and attaches them all to the GitHub
# Release for the pushed tag. NSIS (Windows) cannot be built reliably from macOS,
# which is why Windows builds on windows-latest here.
#
# Trigger: push a tag like `v0.5.2`.
#   git tag v0.5.2 && git push origin v0.5.2
#
# Builds are UNSIGNED (no signing certs configured). To sign/notarize, add the
# platform certs as repo secrets and wire them into electron-builder.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS installer
            build: npm run dist:mac
            glob: "release/*.dmg"
          - os: windows-latest
            name: Windows installer
            build: npm run dist:win
            glob: "release/*.exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build installer
        run: ${{ matrix.build }}

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.glob }}

  mcpb:
    name: .mcpb bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Pack .mcpb
        run: npm run pack:mcpb

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: linkedin-mcp.mcpb
